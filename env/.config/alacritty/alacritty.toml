[general]
import = [
  # "~/.config/alacritty/themes/themes/gruber-darker.toml",
  # "~/.config/alacritty/themes/themes/linux.toml",
  # "~/.config/alacritty/themes/themes/catppuccin_latte.toml",
  # "~/.config/alacritty/themes/themes/midnight_haze.toml",
  "~/.config/alacritty/themes/themes/gruber_darker.toml",
]

[window]
opacity = 0.96
dynamic_padding = false


[colors.cursor]
cursor = "#EC5D2A"

[font]
# normal = { family = "comic code" }
# normal = { family = "courier prime code" }
# normal = { family = "new computer modern mono 10" }
# normal = { family = "Monocraft" }
normal = { family = "iosevkaterm" }
size = 16

[keyboard]
bindings = [
    { key = ")", mods = "Control", mode = "AppCursor", action = "ResetFontSize" },
]
