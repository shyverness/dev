[general]
import = [
  "~/.config/alacritty/themes/themes/rose_pine.toml",
]

[window]
opacity = 1
dynamic_padding = true


[colors.cursor]
cursor = "#EC5D2A"

[font]
# normal = { family = "comic code light" }
# normal = { family = "courier prime" }
# normal = { family = "new computer modern mono 10" }
normal = { family = "Monocraft" }
size = 20

[keyboard]
bindings = [
    { key = ")", mods = "Control", mode = "AppCursor", action = "ResetFontSize" },
]
