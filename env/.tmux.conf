unbind C-b
set-option -g prefix C-space
bind-key C-e send-prefix

# set -g      cursor-style default
set-option -g default-shell /bin/zsh
set -g        set-clipboard on
set -g        default-terminal "tmux-256color"
set -as       terminal-features ',*:RGB'
set -as       terminal-features ',*:usstyle'
set -s        escape-time 0
set -g        renumber-windows on
set -g        base-index 1
set -g        set-titles on
set -g        set-titles-string "#{session_name}: #{window_name}"
set -g        mouse on
set -s        clear-on-attach off

set -g        status on
set -g        status-interval 1
set -g        status-justify left
set -g        status-position top
set -g        status-left-length 100
set -g        status-right-length 100
# source-file ~/.tmux.vague-theme.conf

set -g status-left "#S > "
set -g status-right "%H:%M:%S"
set -g window-status-separator " "
set -g window-status-format "#[fg=white]#I:#W"
set -g window-status-current-format "#{?client_prefix,¬,}#[fg=black,bg=white]#I:#W"

bind o copy-mode
unbind -T copy-mode Enter
bind -T copy-mode Enter send-keys -X copy-selection
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe 'wl-copy'

bind "v" split-window -v
bind "h" split-window -h

bind r run-shell "tmux source ~/.tmux.conf"

bind f new-window "vfz ~"
bind-key -r C-f run-shell "vfz ~"

bind-key -T prefix s choose-tree -sOname

bind -n "M-/" select-window -t "1"
bind -n "M-(" select-window -t "2"
bind -n "M-[" select-window -t "3"
bind -n "M-{" select-window -t "4"
bind -n "M-'" select-window -t "5"
